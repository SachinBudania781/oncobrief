name: CI
on: [push, pull_request]
env:
  SCARF_ANALYTICS: "false"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements.txt pytest
      - run: cd backend && pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: cd frontend && npm ci && npm run build && npm run build:apps
      - run: cd frontend && npm audit --audit-level=moderate
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oncobrief_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: oncobrief_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://oncobrief_test:local_ci_only@localhost:5432/oncobrief_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r backend/requirements.txt pytest
      - run: cd backend && pytest -q
