{
  "services": [
    {
      "type": "web",
      "name": "oncobrief-round2-api",
      "runtime": "docker",
      "dockerfilePath": "./deploy/pantheon-integrated.Dockerfile",
      "dockerContext": ".",
      "region": "singapore",
      "plan": "free",
      "healthCheckPath": "/api/health",
      "numInstances": 1,
      "autoDeployTrigger": "off",
      "envVars": [
        {
          "key": "DEMO_MODE",
          "value": "true"
        },
        {
          "key": "COOKIE_SECURE",
          "value": "true"
        },
        {
          "key": "LLM_PROVIDER",
          "value": "none"
        },
        {
          "key": "DATABASE_URL",
          "fromDatabase": {
            "name": "oncobrief-round2-db",
            "property": "connectionString"
          }
        },
        {
          "key": "DATA_ENCRYPTION_KEY",
          "generateValue": true
        },
        {
          "key": "FILE_SIGNING_KEY",
          "generateValue": true
        },
        {
          "key": "ALLOWED_ORIGINS",
          "value": "https://oncobrief-round2-patient-yogesh.onrender.com,https://oncobrief-round2-doctor-yogesh.onrender.com,https://oncobrief-round2-staff-yogesh.onrender.com"
        },
        {
          "key": "PUBLIC_BASE_URL",
          "value": "https://oncobrief-round2-patient-yogesh.onrender.com"
        }
      ]
    }
  ],
  "databases": [
    {
      "name": "oncobrief-round2-db",
      "databaseName": "oncobrief_round2_db",
      "user": "oncobrief_round2_db_user",
      "region": "singapore",
      "plan": "free",
      "postgresMajorVersion": "16",
      "ipAllowList": []
    }
  ]
}
