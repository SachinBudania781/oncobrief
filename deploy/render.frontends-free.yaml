{
  "services": [
    {
      "type": "web",
      "name": "oncobrief-round2-patient",
      "runtime": "static",
      "buildCommand": "cd frontend && npm ci --no-audit --no-fund && npm run build:patient",
      "staticPublishPath": "./frontend/dist/patient",
      "autoDeployTrigger": "checksPass",
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "24"
        },
        {
          "key": "SCARF_ANALYTICS",
          "value": "false"
        }
      ],
      "routes": [
        {
          "type": "rewrite",
          "source": "/api/*",
          "destination": "https://oncobrief-round2-api.onrender.com/api/*"
        },
        {
          "type": "rewrite",
          "source": "/docs",
          "destination": "https://oncobrief-round2-api.onrender.com/docs"
        },
        {
          "type": "rewrite",
          "source": "/openapi.json",
          "destination": "https://oncobrief-round2-api.onrender.com/openapi.json"
        },
        {
          "type": "rewrite",
          "source": "/*",
          "destination": "/index.html"
        }
      ],
      "headers": [
        {
          "path": "/*",
          "name": "X-Content-Type-Options",
          "value": "nosniff"
        },
        {
          "path": "/*",
          "name": "X-Frame-Options",
          "value": "SAMEORIGIN"
        },
        {
          "path": "/*",
          "name": "Referrer-Policy",
          "value": "no-referrer"
        },
        {
          "path": "/*",
          "name": "Permissions-Policy",
          "value": "camera=(self), microphone=(self), geolocation=(self)"
        },
        {
          "path": "/api/*",
          "name": "Cache-Control",
          "value": "no-store"
        },
        {
          "path": "/sw.js",
          "name": "Cache-Control",
          "value": "no-cache"
        },
        {
          "path": "/manifest.webmanifest",
          "name": "Cache-Control",
          "value": "no-cache"
        },
        {
          "path": "/manifest.webmanifest",
          "name": "Content-Type",
          "value": "application/manifest+json"
        },
        {
          "path": "/index.html",
          "name": "Cache-Control",
          "value": "no-cache"
        }
      ]
    },
